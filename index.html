<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071c18">
  <title>Türkiye'nin En İyi Online Poker Odası</title>
  <style>
    :root {
      color-scheme: dark;
      --felt: #0d4938;
      --felt-deep: #071c18;
      --ivory: #f5f0e4;
      --muted: #c5d1c9;
      --coral: #e86b4a;
      --line: rgba(245, 240, 228, .18);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ivory);
      background:
        radial-gradient(ellipse at 78% 18%, rgba(31, 112, 83, .34), transparent 38%),
        radial-gradient(ellipse at 12% 90%, rgba(232, 107, 74, .10), transparent 34%),
        var(--felt-deep);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .frame {
      width: min(100%, 760px);
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 6vw, 58px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(15, 73, 56, .96), rgba(7, 28, 24, .98) 70%);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .32);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .frame::before {
      content: "♠";
      position: absolute;
      z-index: -1;
      right: -28px;
      top: 5px;
      font-family: Georgia, serif;
      font-size: clamp(220px, 42vw, 390px);
      line-height: 1;
      color: rgba(245, 240, 228, .035);
      transform: rotate(12deg);
      pointer-events: none;
    }
    .eyebrow {
      margin: 0 0 28px;
      color: #c8d8ce;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 600px;
      margin: 0;
      font-size: clamp(38px, 7.2vw, 68px);
      line-height: .99;
      letter-spacing: -.055em;
      font-weight: 800;
    }
    h1 span {
      display: block;
      color: var(--coral);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.045em;
      margin: 8px 0;
    }
    .rule {
      width: 66px;
      height: 3px;
      margin: 28px 0 22px;
      background: var(--coral);
      border-radius: 3px;
    }
    .description {
      max-width: 490px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 2.5vw, 19px);
      line-height: 1.65;
    }
    .bottom { margin-top: 40px; }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 58px;
      padding: 0 24px;
      color: #fffaf2;
      background: var(--coral);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .075em;
      transition: transform .18s ease, background .18s ease;
    }
    .cta:hover { background: #f17b59; transform: translateY(-2px); }
    .cta:focus-visible { outline: 3px solid var(--ivory); outline-offset: 4px; }
    .arrow { font-size: 20px; line-height: 1; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .frame { min-height: 500px; border-radius: 16px; }
      .eyebrow { margin-bottom: 34px; }
      .bottom { margin-top: 34px; }
      .cta { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cta { transition: none; }
    }
  </style>

</head>
<body>
  <main class="frame">
    <section>
      <p class="eyebrow">ONLINE POKER</p>
      <h1>Türkiye'nin <span>En İyi</span> Online Poker Odası</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="description">Güçlü oyuncular, özel masalar ve gerçek yüksek bahis atmosferi.</p>
    </section>
    <div class="bottom">
      <a class="cta" href="https://t.me/+79kwBGM9VX9hYzVi" target="_blank" rel="noopener noreferrer">

  </main>
