<head>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101713;
      --surface: #18231c;
      --green: #d4e5cf;
      --text: #f4f4ee;
      --muted: #a9b1a8;
      --burgundy: #742d3b;
      --burgundy-hover: #8b3949;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background:
        radial-gradient(
          ellipse at 75% 25%,
          rgba(49, 82, 57, 0.23),
          transparent 48%
        ),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .header {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 30px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 10px;
      border-radius: 50%;
      background: var(--green);
      vertical-align: 2px;
    }

    .main {
      flex: 1;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 45px 6% 70px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      gap: 48px;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 590px;
    }

    .eyebrow {
      margin-bottom: 25px;
      color: var(--green);
      font-size: 11px;
      line-height: 1.5;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      font-size: clamp(42px, 5.8vw, 76px);
      line-height: 1.04;
      font-weight: 500;
      letter-spacing: -0.055em;
    }

    h1 span {
      display: block;
      color: var(--green);
      margin-top: 8px;
    }

    .features {
      list-style: none;
      margin-top: 38px;
      display: grid;
      gap: 0;
    }

    .features li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 0;
      border-bottom: 1px solid rgba(225, 235, 220, 0.12);
      color: #e1e5dd;
      font-size: 15px;
      line-height: 1.5;
    }

    .feature-number {
      width: 26px;
      flex-shrink: 0;
      color: #94ad91;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .cta {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 34px;
      padding: 0 25px;
      background: var(--burgundy);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition: background 180ms ease, transform 180ms ease;
    }

    .cta:hover {
      background: var(--burgundy-hover);
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 4px;
    }

    .arrow {
      font-size: 18px;
      line-height: 1;
    }

    .visual {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 30px 0;
    }

    .table-scene {
      width: min(100%, 460px);
      aspect-ratio: 0.88;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .halo {
      position: absolute;
      width: 85%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(84, 123, 83, 0.19),
        rgba(84, 123, 83, 0.03) 50%,
        transparent 72%
      );
      z-index: -1;
    }

    .table {
      position: absolute;
      width: 94%;
      aspect-ratio: 0.78;
      border-radius: 50%;
      transform: rotate(-31deg);
      background: linear-gradient(
        145deg,
        #293b2d 0%,
        #15291c 40%,
        #0c1710 100%
      );
      border: 9px solid #202923;
      box-shadow:
        0 0 0 1px rgba(213, 228, 207, 0.17),
        0 30px 80px rgba(0, 0, 0, 0.38),
        inset 0 0 0 2px rgba(255, 255, 255, 0.025),
        inset 0 0 65px rgba(0, 0, 0, 0.28);
    }

    .table::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(216, 231, 209, 0.16);
      border-radius: 50%;
    }

    .table::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255, 255, 255, 0.012) 4px
      );
    }

    .playing-card {
      position: absolute;
      width: 28%;
      aspect-ratio: 0.69;
      border-radius: 7px;
      background: linear-gradient(145deg, #fffef8, #e6e5db);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.36);
      display: flex;
      align-items: flex-start;
      padding: 10px;
      color: #19221b;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 3.1vw, 38px);
      line-height: 1;
    }

    .card-one {
      left: 25%;
      top: 27%;
      transform: rotate(-13deg);
    }

    .card-two {
      left: 43%;
      top: 24%;
      transform: rotate(8deg);
      color: #742d3b;
    }

    .card-center {
      position: absolute;
      width: 2px;
      height: 40%;
      top: 30%;
      left: 50%;
      transform: rotate(28deg);
      background: rgba(235, 241, 229, 0.12);
    }

    .chips {
      position: absolute;
      right: 17%;
      bottom: 25%;
      width: 94px;
      height: 65px;
      transform: rotate(-18deg);
    }

    .chip {
      position: absolute;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      border: 5px dashed #d5d9cb;
      background: #26352a;
      box-shadow:
        0 7px 0 #111b14,
        0 10px 17px rgba(0, 0, 0, 0.35),
        inset 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    .chip:nth-child(1) {
      left: 0;
      top: 0;
    }

    .chip:nth-child(2) {
      left: 25px;
      top: 8px;
      background: #71303c;
      border-color: #ead8d5;
    }

    .chip:nth-child(3) {
      left: 43px;
      top: -4px;
      background: #28352c;
    }

    .footer {
      padding: 20px 6% 26px;
      text-align: center;
      color: #788379;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    @media (min-width: 1400px) {
      .main {
        padding-top: 70px;
        padding-bottom: 90px;
      }
    }

    @media (max-width: 760px) {
      .header {
        padding: 24px 7%;
      }

      .main {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 43px 7% 35px;
      }

      .content {
        max-width: 540px;
      }

      .eyebrow {
        margin-bottom: 20px;
      }

      h1 {
        font-size: clamp(43px, 10vw, 66px);
      }

      .features {
        margin-top: 27px;
      }

      .features li {
        padding: 13px 0;
        font-size: 14px;
      }

      .cta {
        width: 100%;
        min-height: 56px;
        margin-top: 27px;
      }

      .visual {
        padding: 0;
        margin-top: 10px;
      }

      .table-scene {
        width: min(100%, 350px);
        aspect-ratio: 1.05;
      }

      .table {
        width: 83%;
      }

      .playing-card {
        width: 25%;
        font-size: 31px;
      }

      .card-one {
        left: 28%;
        top: 27%;
      }

      .card-two {
        left: 44%;
        top: 25%;
      }

      .chips {
        right: 20%;
        bottom: 23%;
        transform: scale(0.85) rotate(-18deg);
      }

      .footer {
        padding: 18px 7% 22px;
      }
    }

    @media (max-width: 380px) {
      .main {
        padding-top: 32px;
      }

      h1 {
        font-size: 41px;
      }

      .brand {
        font-size: 11px;
      }

      .table-scene {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <div class="brand">
        <span class="brand-mark"></span>
        POKER
      </div>
    </header>

    <main class="main">

      <section class="content">
        <p class="eyebrow">ONLINE POKER</p>

        <h1>
          Pokerin.

        <ul class="features">

        </ul>

        <a

          <span>DAHA FAZLA BİLGİ</span>

      <section class="visual" aria-hidden="true">

          <div class="chips">
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">
      POKER
    </footer>

  </div>

  <script>
    // Track CTA clicks in Meta Pixel
    const telegramButton = document.getElementById('telegram-cta');

    telegramButton.addEventListener('click', function () {

  </script>
</body>
</html>
